# Text sensors
text_sensor:
  - platform: hlk_ld2402
    id: radar_operating_mode
    name: "运行模式​​"  
    entity_category: diagnostic
    hlk_ld2402_id: radar_sensor
    operating_mode: true

# Control buttons - using template buttons 
button:
  - platform: template
    name: "校准阈值(默认=3)"  
    entity_category: config
    on_press:
      - lambda: id(radar_sensor).calibrate();

  - platform: template
    name: "自动增益​​​"  
    entity_category: config
    on_press:
      - lambda: id(radar_sensor).enable_auto_gain();

  - platform: template
    name: "保存配置 " 
    entity_category: config
    on_press:
      - lambda: id(radar_sensor).save_config();

  - platform: template
    name: "工程模式​​​​​"  
    icon: "mdi:tune-variant"
    entity_category: diagnostic
    on_press:
      - lambda: id(radar_sensor).set_engineering_mode_direct();

  - platform: template
    name: "正常模式​​​​​​"  
    icon: "mdi:tune-variant-off"
    entity_category: diagnostic
    on_press:
      - lambda: id(radar_sensor).set_normal_mode_direct();
      
  - platform: template
    name: "重置设置(含最大距离和超时，阈值=3)"  
    icon: "mdi:factory-reset"
    entity_category: config
    on_press:
      - logger.log: "WARNING: Performing factory reset on radar module with custom parameters"
      - lambda: |-
          id(radar_sensor).factory_reset_with_params(
            id(max_distance_param).state,
            static_cast<int>(id(timeout_param).state)
          );

  - platform: template
    name: "校准(按​敏⁡感度)⁡"  
    icon: "mdi:tune-vertical-variant"
    entity_category: config
    on_press:
      - lambda: |-
          id(radar_sensor).calibrate_with_coefficients(
            id(trigger_coefficient).state,
            id(hold_coefficient).state,
            id(micromotion_coefficient).state
          );

  - platform: template
    name: "读取运动阈值​​​​​​​​"  
    id: read_motion_thresholds
    icon: "mdi:refresh"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(radar_sensor).read_motion_thresholds();
          delay(500);
      
  - platform: template
    name: "读取微动阈值​​​​​​​​​"  
    id: read_micromotion_thresholds
    icon: "mdi:refresh"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(radar_sensor).read_micromotion_thresholds();
          delay(500);

  - platform: template
    name: "设置单距离段阈值"
    icon: "mdi:check-circle"
    entity_category: config
    on_press:
      - lambda: |-
          int gate = std::stoi(id(gate_number_select).current_option());
          float db_value = id(threshold_value_input).state;
          std::string threshold_type = id(threshold_type_select).current_option();
          
          ESP_LOGI("radar", "Setting Gate %d %s to %.1f dB", 
                   gate, threshold_type.c_str(), db_value);
          
          if (threshold_type == "运动阈值") {
            if (id(radar_sensor).set_motion_threshold(gate, db_value)) {
              ESP_LOGI("radar", "✓ Motion threshold set successfully");
            } else {
              ESP_LOGE("radar", "✗ Failed to set motion threshold");
            }
          } else {
            if (id(radar_sensor).set_micromotion_threshold(gate, db_value)) {
              ESP_LOGI("radar", "✓ Micromotion threshold set successfully");
            } else {
              ESP_LOGE("radar", "✗ Failed to set micromotion threshold");
            }
          }

# Add sliders for calibration coefficients and gate thresholds
number:
  - platform: template
    name: "校准触发系数(默认=1)"  
    id: trigger_coefficient
    optimistic: true
    min_value: 1.0
    max_value: 20.0
    step: 0.1
    initial_value: 1.0
    icon: "mdi:tune-vertical"
    unit_of_measurement: "x"
    entity_category: config
    
  - platform: template
    name: "校准保持系数(默认=1.0)"  
    id: hold_coefficient
    optimistic: true
    min_value: 1.0
    max_value: 20.0
    step: 0.1
    initial_value: 1.0
    icon: "mdi:tune-vertical"
    unit_of_measurement: "x"
    entity_category: config
    
  - platform: template
    name: "校准微动系数(默认=1)​"  
    id: micromotion_coefficient
    optimistic: true
    min_value: 1.0
    max_value: 20.0
    step: 0.1
    initial_value: 1.0
    icon: "mdi:tune-vertical"
    unit_of_measurement: "x"
    entity_category: config
    
  - platform: template
    name: "最大距离 (仅复位用)​​​​​​​​​​"  
    id: max_distance_param
    optimistic: true
    min_value: 1.0
    max_value: 10.0
    step: 0.1
    initial_value: 8.0
    icon: "mdi:ruler"
    unit_of_measurement: "m"
    entity_category: config
    
  - platform: template
    name: "超时时间 (仅复位用)​​​​​​​​​​​"  
    id: timeout_param
    optimistic: true
    min_value: 1
    max_value: 30
    step: 1
    initial_value: 5
    icon: "mdi:timer-outline"
    unit_of_measurement: "s"
    entity_category: config

  - platform: template
    name: "距离段数值 (dB)"
    id: threshold_value_input
    optimistic: true
    min_value: 0
    max_value: 95
    step: 0.1
    initial_value: 50.0
    icon: "mdi:volume-high"
    unit_of_measurement: "dB"
    entity_category: config

